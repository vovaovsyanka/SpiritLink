[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra
markers =
    db: нужен PostgreSQL (DATABASE_URL); тесты идут в отдельной схеме и ничего не трогают в ваших таблицах
    models: нужны реальные модели (BERT и GGUF), запускаются только с --run-models
