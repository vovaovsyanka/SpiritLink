# Мониторинг:  docker compose -f compose.monitoring.yml up -d
#
#   prometheus     — каждые 15 с обходит цели и сохраняет метрики (хранит 15 дней)
#   grafana        — рисует графики по данным Prometheus; дашборд подключается сам (monitoring/grafana/)
#   node-exporter  — метрики самой ВМ (процессор, память, диск): по ним видно, когда нагрузочный тест упирается в железо
#
# Цели prometheus: приложения обоих стендов (по сети spiritlink-monitoring) и node-exporter.
# Prometheus наружу не публикуется — смотреть данные нужно в Grafana.

name: spiritlink-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?задайте GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Для NPM (домен Grafana -> ВМ:3000); снаружи порт закрыт группой безопасности
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [monitoring]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  prometheus-data:
  grafana-data:

networks:
  monitoring:
    name: spiritlink-monitoring
    external: true
