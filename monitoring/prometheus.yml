# Что и как часто собирает Prometheus
global:
  scrape_interval: 15s

scrape_configs:
  # Приложения: имена spiritlink-<стенд>-app — это псевдонимы из compose.yml в общей сети spiritlink-monitoring.
  # Если стенд не запущен, его цель просто показывает up=0 — это нормально.
  - job_name: spiritlink
    metrics_path: /metrics
    static_configs:
      - targets: ["spiritlink-prod-app:8000"]
        labels: { env: prod }
      - targets: ["spiritlink-stage-app:8000"]
        labels: { env: stage }

  # Железо ВМ
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
