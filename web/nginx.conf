# nginx внутри контейнера "web": раздаёт игру (Unity WebGL) и пропускает запросы к API в контейнер "app".
# Для браузера всё живёт по одному адресу, поэтому не нужны CORS и нет "смешанного содержимого" (https-страница -> http-API).
# TLS (https) здесь нет: его снимает Nginx Proxy Manager сервера перед ВМ.

# NPM передаёт X-Forwarded-Proto: https. Если заголовка нет (локальный запуск), берём схему самого соединения.
map $http_x_forwarded_proto $public_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 8080;             # без root-прав порты < 1024 занимать нельзя
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Игра грузит .wasm и .data по 30-50 МБ несжатыми; gzip уменьшает их в 3-4 раза
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/wasm application/octet-stream application/javascript text/css application/json image/svg+xml;

    # Адрес API для игры. Клиент читает его из StreamingAssets/config.json; отдаём его "на лету" из адреса,
    # по которому открыта страница, и один и тот же образ работает локально, на stage и в prod.
    location = /StreamingAssets/config.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"server_url": "$public_scheme://$http_host"}';
    }

    # Закрыто снаружи: метрики читает только Prometheus напрямую у контейнера app (внутренняя сеть docker)
    location = /metrics {
        return 404;
    }

    # API игры и документация Swagger (/docs, /openapi.json) -> контейнер app
    location ~ ^/(auth|me|passes|predict|health|world-levels|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        # Ответ языковой модели может идти до двух минут (LLM_TIMEOUT_SEC = 120)
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Всё остальное — статические файлы игры. Имена файлов сборки Unity не меняются между версиями,
    # поэтому no-cache: браузер каждый раз спрашивает "файл изменился?" (ETag) и перекачивает только при пересборке.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
